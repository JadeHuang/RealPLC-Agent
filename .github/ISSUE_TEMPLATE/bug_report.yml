name: Bug 报告
description: 报告安装、连接、CODESYS 验证或 Diagnostics 问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只使用测试工程或已脱敏的信息，不要上传访问令牌、设备密钥、客户数据或完整 PLC 工程。
  - type: dropdown
    id: agent_version
    attributes:
      label: RealPLC Agent 版本
      options:
        - v0.4.0
        - 其他版本
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows 版本
      description: 例如 Windows 11 24H2 x64。
    validations:
      required: true
  - type: input
    id: codesys_version
    attributes:
      label: CODESYS 完整版本
      description: 请包含 V3.5、SP、Patch、OEM 名称和 Profile。
      placeholder: CODESYS V3.5 SP21 Patch 5
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 安装或升级
        - Agent 连接
        - CODESYS 环境检测
        - CODESYS 原生编译
        - IDE Simulation
        - Diagnostics
        - 日志或界面
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明实际发生了什么，以及出现问题的时间点。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 启动 RealPLC Agent
        2. 打开测试工程
        3. 发起验证
        4. 出现错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics 与已脱敏日志
      description: 可粘贴关键错误，或拖入已脱敏的日志和截图。
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 我使用的是测试工程、工程副本或隔离环境。
          required: true
        - label: 我已删除凭据、客户信息、项目源码、设备地址和其他敏感数据。
          required: true
        - label: 我已核对兼容性说明和现有 Issues。
          required: true
